# CDL Conda Environment
# Contextual Dynamics Laboratory, Dartmouth College
#
# This environment includes all packages needed for CDL research.
#
# To create this environment:
#   conda env create -f cdl-environment.yml
#
# To update an existing environment:
#   conda env update -n cdl -f cdl-environment.yml --prune
#
# To activate:
#   conda activate cdl
#
# MAINTENANCE NOTE: anything that ships compiled extension modules (numba,
# llvmlite, umap-learn, pytorch, ...) belongs in the `dependencies:` list
# below, NOT in the `pip:` section. conda-forge builds those for every
# platform we support, including Intel Macs; PyPI no longer does, so pip
# falls back to compiling from source and the install fails. Only
# pure-Python or PyPI-only packages belong under `pip:`.
#

name: cdl
channels:
  - conda-forge
  # `defaults` is deliberately omitted: it requires interactively accepting
  # Anaconda's Terms of Service, which breaks the non-interactive
  # `conda env create` run by scripts/setup.sh. The `pytorch` channel is
  # omitted for the same reason it is no longer needed -- it stopped
  # publishing new builds after 2.5.1, and conda-forge now ships newer
  # pytorch/torchvision/torchaudio for both macOS architectures.
  - nodefaults

dependencies:
  # Python version
  - python=3.11

  # Core scientific computing
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - polars>=0.19

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  # Machine learning
  - scikit-learn>=1.3

  # JIT compilation and dimensionality reduction.
  # These MUST come from conda-forge rather than pip: PyPI stopped shipping
  # macOS x86_64 wheels at llvmlite 0.46 / numba 0.63, so on an Intel Mac pip
  # falls back to building llvmlite from source and fails with
  # "Failed building wheel for llvmlite" (issue #190). umap-learn is listed
  # here (rather than under pip) so that pip never tries to resolve numba or
  # llvmlite itself; pynndescent comes along with it.
  - numba>=0.61
  - llvmlite>=0.44
  - umap-learn>=0.5

  # PyTorch - will install appropriate version for platform (CPU/CUDA/MPS)
  - pytorch>=2.0
  - torchvision>=0.15
  - torchaudio>=2.0

  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Interactive plotting
  - ipympl

  # Utilities
  - requests>=2.28
  - tqdm
  - joblib
  - h5py
  - pyyaml

  # Development tools
  - pytest
  - pytest-cov

  # Neuroimaging (lightweight dependencies)
  - nibabel
  - nilearn

  # pip-installed packages
  # (pure-Python or not available on conda-forge -- see the maintenance note
  # at the top of this file before adding anything that compiles)
  - pip
  - pip:
    # Transformers and HuggingFace
    - transformers>=4.30
    - diffusers>=0.21
    - datasets>=2.14
    - huggingface-hub>=0.17
    - accelerate>=0.24

    # CDL packages
    - hypertools>=0.8
    - quail>=0.2
    - timecorr>=0.1
    - supereeg>=0.2

    # Data storage
    - deepdish>=0.3

    # PPCA for hypertools
    - ppca>=0.0.4
